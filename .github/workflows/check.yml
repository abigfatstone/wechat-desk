name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SQLCipher
        run: brew install sqlcipher
      - name: Tests
        run: node --test test/*.test.mjs
