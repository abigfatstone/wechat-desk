name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The query layer needs 3.10+; macOS runners ship an older CLT python3.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SQLCipher
        run: brew install sqlcipher
      - name: Diagnose query layer
        continue-on-error: true
        run: |
          cd vendor/wechat-decrypt
          python3 -c "import sys; print(sys.version)"
          python3 scripts/common/query.py list --json; echo "exit=$?"
      - name: Tests
        run: node --test test/*.test.mjs
